openapi: 3.1.0
info:
  title: reloadSol Public & Operator API
  version: 1.0.0
  description: |
    Dual-chain trading, dust recovery, portfolio, and algorithmic strategy API for
    **Solana Mainnet (`sol`)** and **Robinhood Chain (`robinhood`, EVM `4663`)**.
servers:
  - url: https://reloadsol.app
    description: Production (Cloudflare Edge + Nginx)
paths:
  /api/health:
    get:
      summary: Service Health Check
      tags: [Public]
      responses:
        "200":
          description: Web service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/solprice:
    get:
      summary: Live SOL/USD Price
      description: Returns live SOL/USD from Bybit → CoinGecko/Jupiter (30s cache). Never returns a hardcoded fallback.
      tags: [Public]
      responses:
        "200":
          description: Live SOL price
          content:
            application/json:
              schema:
                type: object
                properties:
                  price:
                    type: number
                    example: 185.42
                  source:
                    type: string
                    example: bybit
        "503":
          description: All upstream price feeds unavailable
  /api/ethprice:
    get:
      summary: Live ETH/USD Price
      tags: [Public]
      responses:
        "200":
          description: Live ETH price
  /api/wallet/preview:
    get:
      summary: Signed-Out Solana Wallet Preview
      description: Returns native SOL balance, sellable token value, and reclaimable ATA rent for any Solana address.
      tags: [Public]
      parameters:
        - name: address
          in: query
          required: true
          description: Base58 Solana wallet address
          schema:
            type: string
      responses:
        "200":
          description: Portfolio recovery snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  nativeSol:
                    type: number
                  sellableSol:
                    type: number
                  reclaimSol:
                    type: number
                  sellableCount:
                    type: integer
  /api/regime/climate:
    get:
      summary: Macro Market Climate & Size Multiplier
      description: Returns the current Market Brain climate state (`Hype`, `Range`, `Mixed`, `De-risk`, `Cash`) and position size scale.
      tags: [Public]
      responses:
        "200":
          description: Current climate posture
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
                    example: Range
                  scale:
                    type: number
                    example: 0.75
                  cascadeVeto:
                    type: boolean
                    example: false
  /api/rpc/diagnostics:
    get:
      summary: RPC Endpoint Health & Send Telemetry
      tags: [Public]
      parameters:
        - name: send
          in: query
          required: false
          description: Set to `1` (7d) or `90` (90d) to include proxy-level transaction landing telemetry from `swap_tca`.
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Ranked RPC endpoint status (`ok` / `send-only` / `error`) and optional send telemetry
  /api/operations/ask-for-fund:
    post:
      summary: Request Gas Recovery Assistance
      description: Allows a 0-SOL wallet with recoverable tokens/ATAs to request manual gas assistance. Eligibility is re-derived server-side.
      tags: [Public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [walletAddress]
              properties:
                walletAddress:
                  type: string
                  description: Base58 Solana wallet address
      responses:
        "200":
          description: Assistance request recorded and forwarded to ops
        "429":
          description: Rate-limited or wallet on cooldown
  /api/trading/records:
    get:
      summary: Wallet Trade History
      description: Returns `wallet:chain`-scoped trading records (`buy`, `sell`, `close`). Requires wallet session.
      tags: [Wallet]
      parameters:
        - name: wallet
          in: query
          required: true
          schema:
            type: string
        - name: chain
          in: query
          required: false
          schema:
            type: string
            enum: [sol, robinhood]
            default: sol
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of trading records
        "401":
          description: Wallet session required
  /api/strategies:
    get:
      summary: List Merged Strategy Definitions
      description: Returns typed registry defaults merged with `strategy_definitions` DB overrides. Dev-wallet gated.
      tags: [Dev]
      responses:
        "200":
          description: Active and inactive strategy definitions across chains
        "401":
          description: Dev-wallet session required
